<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural da Comunidade</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col">

  <!-- Cabeçalho -->
  <header class="bg-indigo-700 text-white p-6 shadow-md text-center">
    <h1 class="text-2xl font-bold">Mural do Nosso Grupo</h1>
    <p class="text-indigo-200 text-sm mt-1">Acompanhe nossas ações, conquistas e momentos de fé</p>
  </header>

  <!-- Area de Filtros -->
  <section class="max-w-2xl mx-auto w-full px-4 pt-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Filtrar Publicações</h3>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        
        <!-- Filtro Categoria -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Categoria</label>
          <select id="filterCategory" onchange="applyFilters()" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:ring-1 focus:ring-indigo-500 bg-white">
            <option value="">Todas as categorias</option>
          </select>
        </div>

        <!-- Filtro Data Inicio -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Data Inicial</label>
          <input type="date" id="filterStartDate" onchange="applyFilters()" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:ring-1 focus:ring-indigo-500 bg-white">
        </div>

        <!-- Filtro Data Fim -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Data Final</label>
          <input type="date" id="filterEndDate" onchange="applyFilters()" class="w-full p-2 text-xs border border-gray-300 rounded-lg focus:ring-1 focus:ring-indigo-500 bg-white">
        </div>

      </div>

      <!-- Botao Limpar -->
      <div class="mt-3 flex justify-end">
        <button onclick="clearFilters()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium transition-colors">
          Limpar filtros
        </button>
      </div>
    </div>
  </section>

  <!-- Feed Principal -->
  <main class="max-w-2xl mx-auto p-4 space-y-6 w-full flex-grow" id="feed"></main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzRff6OpHP37dEqAfOLIvmSY2L-Jp0uEUxiZZqK2oMsx8dCVDxzANx2VKjaFV0-mfsq/exec";

    let rawPosts = [];
    let rawComentarios = [];

    function formatData(dataString) {
      if (!dataString) return '';
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(dataString)) return dataString;

      const date = new Date(dataString);
      if (!isNaN(date.getTime())) {
        return date.toLocaleDateString('pt-BR', {
          timeZone: 'UTC',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        });
      }
      return dataString;
    }

    async function loadFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '<p class="text-center text-gray-500 py-8">Carregando mural...</p>';

      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        rawPosts = data.posts || [];
        rawComentarios = data.comentarios || [];

        populateCategories(rawPosts);
        applyFilters();

      } catch (err) {
        feed.innerHTML = '<p class="text-center text-red-500 py-8">Erro ao carregar o mural. Tente novamente mais tarde.</p>';
      }
    }

    function populateCategories(posts) {
      const categorySelect = document.getElementById('filterCategory');
      const categories = [...new Set(posts.map(p => p.categoria).filter(Boolean))];
      
      categorySelect.innerHTML = '<option value="">Todas as categorias</option>';
      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    function applyFilters() {
      const selectedCategory = document.getElementById('filterCategory').value;
      const startDate = document.getElementById('filterStartDate').value;
      const endDate = document.getElementById('filterEndDate').value;

      let filtered = rawPosts.filter(post => {
        // Filtro por Categoria
        if (selectedCategory && post.categoria !== selectedCategory) {
          return false;
        }

        // Converte data da postagem para comparacao
        let postDate = post.dataISO;
        if (!postDate && post.data) {
          const parts = post.data.split('/');
          if (parts.length === 3) {
            postDate = `${parts[2]}-${parts[1]}-${parts[0]}`;
          }
        }

        // Filtro Data Inicial
        if (startDate && postDate && postDate < startDate) {
          return false;
        }

        // Filtro Data Final
        if (endDate && postDate && postDate > endDate) {
          return false;
        }

        return true;
      });

      renderFeed(filtered);
    }

    function clearFilters() {
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterStartDate').value = '';
      document.getElementById('filterEndDate').value = '';
      applyFilters();
    }

    function renderFeed(posts) {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';

      if (posts.length === 0) {
        feed.innerHTML = '<p class="text-center text-gray-500 py-8">Nenhuma postagem encontrada para os filtros selecionados.</p>';
        return;
      }

      posts.forEach(post => {
        const postComments = rawComentarios.filter(c => c.idPost == post.id);

        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200";
        card.innerHTML = `
          ${post.imagem ? `<img src="${post.imagem}" alt="Imagem da postagem" onerror="this.style.display='none'" class="w-full h-64 object-cover">` : ''}
          <div class="p-5">
            <div class="flex items-center justify-between text-xs text-gray-500 mb-2">
              <span class="bg-indigo-100 text-indigo-800 font-semibold px-2.5 py-0.5 rounded-full">${post.categoria || 'Geral'}</span>
              <span>${formatData(post.data)}</span>
            </div>
            <h2 class="text-xl font-bold text-gray-900 mb-2">${post.titulo}</h2>
            <p class="text-gray-700 text-sm mb-4 leading-relaxed">${post.descricao}</p>
            
            <!-- Ações -->
            <div class="flex items-center justify-between border-t border-b border-gray-100 py-3 mb-4">
              <button onclick="likePost(this, ${post.id})" class="flex items-center space-x-1.5 text-gray-600 hover:text-indigo-600 text-sm font-medium transition-colors">
                <span>🙏</span>
                <span>Amém (${post.curtidas || 0})</span>
              </button>
              <span class="text-xs text-gray-400">${postComments.length} comentário(s)</span>
            </div>

            <!-- Lista de Comentários -->
            <div class="space-y-2 mb-4">
              ${postComments.map(c => `
                <div class="bg-gray-50 p-2.5 rounded-lg text-xs">
                  <span class="font-bold text-gray-800">${c.nome}:</span> 
                  <span class="text-gray-600">${c.mensagem}</span>
                </div>
              `).join('')}
            </div>

            <!-- Formulário de Comentário -->
            <form onsubmit="submitComment(event, ${post.id})" class="flex gap-2">
              <input type="text" placeholder="Seu nome" required class="w-1/3 p-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500" name="nome">
              <input type="text" placeholder="Escreva uma mensagem..." required class="w-2/3 p-2 text-xs border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500" name="mensagem">
              <button type="submit" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-xs font-semibold hover:bg-indigo-700 transition-colors">Enviar</button>
            </form>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    async function likePost(btn, idPost) {
      btn.disabled = true;
      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'like', idPost: idPost })
        });
        await loadFeed();
      } catch (e) {
        btn.disabled = false;
      }
    }

    async function submitComment(event, idPost) {
      event.preventDefault();
      const form = event.target;
      const btn = form.querySelector('button[type="submit"]');
      const nome = form.nome.value;
      const mensagem = form.mensagem.value;

      btn.disabled = true;
      btn.textContent = '...';

      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'add_comment', idPost: idPost, nome: nome, mensagem: mensagem })
        });
        form.reset();
        await loadFeed();
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Enviar';
      }
    }

    loadFeed();
  </script>
</body>
</html>
